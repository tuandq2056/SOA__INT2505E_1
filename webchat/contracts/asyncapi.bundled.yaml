    error:
      name: error
      payload:
        type: object
        additionalProperties: false
        required:
          - type
          - request_id
          - code
          - message
          - retryable
        properties:
          type:
            type: string
            const: error
          request_id:
            oneOf:
              - type: string
                format: uuid
                description: Created by the client for each frame; echoed in the reply.
              - type: 'null'
            description: The frame that failed, or null for an error not tied to a frame.
          code:
            type: string
            enum:
              - UNAUTHENTICATED
              - INVALID_CREDENTIALS
              - USERNAME_TAKEN
              - USER_NOT_FOUND
              - NOT_FOUND
              - GOOGLE_DISABLED
              - GOOGLE_UNAVAILABLE
              - GOOGLE_CODE_INVALID
              - OAUTH_STATE_INVALID
              - VALIDATION_ERROR
              - SELF_INVITE
              - ALREADY_FRIENDS
              - INCOMING_REQUEST_EXISTS
              - ACTION_FORBIDDEN
              - REQUEST_NOT_FOUND
              - REQUEST_CLOSED
              - INVALID_CURSOR
              - SELF_CONVERSATION
              - FRIENDSHIP_REQUIRED
              - CONVERSATION_NOT_FOUND
              - INVALID_MEMBERS
              - IDEMPOTENCY_CONFLICT
              - ATTACHMENT_NOT_FOUND
              - INVALID_ATTACHMENT
              - UPLOAD_TOO_LARGE
              - UNSUPPORTED_MEDIA_TYPE
              - INVALID_RANGE
              - READ_AHEAD
              - SUMMARY_UNAVAILABLE
              - SOCIAL_UNAVAILABLE
              - CHAT_UNAVAILABLE
              - IDENTITY_UNAVAILABLE
              - SERVICE_FORBIDDEN
              - INVALID_FRAME
              - NOT_SUBSCRIBED
              - ALREADY_AUTHENTICATED
              - ATTACHMENT_KIND_MISMATCH
              - ATTACHMENT_IN_USE
              - CLIENT_MESSAGE_ID_CONFLICT
          message:
            type: string
          retryable:
            type: boolean
            description: >-
              true for SOCIAL_UNAVAILABLE and CHAT_UNAVAILABLE; the client
              retries with the same client_message_id.
      examples:
        - payload:
            type: error
            request_id: 6a000000-0000-4000-8000-000000000002
            code: FRIENDSHIP_REQUIRED
            message: Hai người không còn là bạn.
            retryable: false
  schemas:
    RequestId:
      type: string
      format: uuid
      description: Created by the client for each frame; echoed in the reply.
    OutgoingContent:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - type
            - text
          properties:
            type:
              type: string
              const: text
            text:
              type: string
              minLength: 1
              maxLength: 4000
        - type: object
          additionalProperties: false
          required:
            - type
            - attachment_id
          properties:
            type:
              type: string
              enum:
                - audio
                - file
            attachment_id:
              type: string
              format: uuid
              description: >
                A pending attachment uploaded by the sender to the same
                conversation. Its kind must

                match `type` (ATTACHMENT_KIND_MISMATCH) and it can be bound only
                once (ATTACHMENT_IN_USE).
