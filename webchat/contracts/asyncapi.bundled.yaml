            request_id: 6a000000-0000-4000-8000-000000000002
            conversation_id: c1000000-0000-4000-8000-000000000001
            client_message_id: d1000000-0000-4000-8000-000000000001
            content:
              type: text
              text: Chào Lâm!
    messageAck:
      name: message.ack
      payload:
        schemaFormat: application/schema+json;version=draft-07
        schema:
          type: object
