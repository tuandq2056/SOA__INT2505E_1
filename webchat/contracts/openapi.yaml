openapi: 3.1.1
info:
  title: WebChat REST API
  version: 1.0.0
  contact:
    name: Nhóm 9 – INT3505E_1
    url: https://github.com/tuandq2056/SOA__INT2505E_1
  license:
    name: Course project - internal use
  description: |
    REST contract for the WebChat course project (Service-Oriented Architecture, week 12 design
    review). This file is the source of truth for the wire format of the REST API. WebSocket events
    on `/ws/v1/chat` are described separately in `asyncapi.yaml` in the same folder.

    Conventions: JSON UTF-8, `snake_case`, UUID ids, RFC 3339 UTC timestamps ending in `Z`. Browser
    tokens have `aud=webchat`. Service tokens have the callee's audience and are accepted only on
    `/internal/v1`.

    Errors always use `ErrorResponse`. Clients branch on `error.code`, never on the message text.
servers:
  - url: http://localhost:8080
    description: Local docker compose stack
  - url: http://localhost:4010
    description: Prism mock (npx @stoplight/prism-cli mock webchat/contracts/openapi.yaml -p 4010)
tags:
  - name: Identity
    description: Accounts, usernames, token issue and user lookup.
  - name: Social
    description: Friend requests, friendships, conversations and membership.
  - name: Chat
    description: Messages, attachments, read-state and unread summaries.
  - name: Internal
    description: Service-to-service endpoints; never called by a browser.
paths:
  /api/v1/auth/register:
    post:
      tags: [Identity]
      operationId: register
      security: []
      summary: Create an account
      description: |
        Username is 3–32 ASCII letters, digits or underscores and is stored lowercase. Password is
        8–128 Unicode code points and keeps its whitespace. Usernames that differ only by case collide.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
            examples:
              long:
                summary: Long registers
                value: { username: long, password: example123 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
              examples:
                long:
                  value: { id: a1000000-0000-4000-8000-000000000001, username: long }
        '409':
          description: USERNAME_TAKEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                usernameTaken:
                  summary: Username differs only by case from an existing one
                  value:
                    request_id: 55000000-0000-4000-8000-000000000011
                    error: { code: USERNAME_TAKEN, message: Username đã được sử dụng. }
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      summary: Exchange credentials for an access token
      description: |
        Wrong username and wrong password return the same error code and message. The body is not
        checked against the registration rules, so a username in the wrong format also returns 401
        INVALID_CREDENTIALS; 422 is only for a missing field or a wrong JSON type.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              long:
                summary: Long logs in
                value: { username: long, password: example123 }
              lam:
                summary: Lâm logs in
                value: { username: lam, password: example456 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
              examples:
                long:
                  summary: Token for Long (illustrative JWT)
                  value:
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhMTAwMDAwMC0wMDAwLTQwMDAtODAwMC0wMDAwMDAwMDAwMDEiLCJ1c2VybmFtZSI6ImxvbmciLCJhdWQiOiJ3ZWJjaGF0In0.example-signature
                    token_type: Bearer
                    expires_in: 3600
                    user: { id: a1000000-0000-4000-8000-000000000001, username: long }
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalidCredentials:
                  summary: Wrong username or wrong password (same code and message)
                  value:
                    request_id: 55000000-0000-4000-8000-000000000001
                    error: { code: INVALID_CREDENTIALS, message: Sai tên đăng nhập hoặc mật khẩu. }
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                missingPassword:
                  summary: A required field is missing
                  value:
                    request_id: 55000000-0000-4000-8000-000000000002
                    error:
                      code: VALIDATION_ERROR
                      message: Dữ liệu không hợp lệ.
                      fields: [{ field: password, reason: required }]

  /api/v1/users/me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: The authenticated user
      description: Returns the public profile of the user in the bearer token.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/users/by-username/{username}:
    get:
      tags: [Identity]
      operationId: getUserByUsername
      summary: Exact username lookup, case-insensitive
      description: Exact match after lowercasing. Used to find a person before sending a friend request.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string, minLength: 3, maxLength: 32 }
          example: Lam
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
              examples:
                lam:
                  summary: "`Lam` matches the stored lowercase `lam`"
                  value: { id: a1000000-0000-4000-8000-000000000002, username: lam }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: USER_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                userNotFound:
                  value:
                    request_id: 55000000-0000-4000-8000-000000000003
                    error: { code: USER_NOT_FOUND, message: Không tìm thấy người dùng. }
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/google/start:
    get:
      tags: [Identity]
      operationId: googleStart
      security: []
      summary: Begin the Google authorization-code flow
      description: |
        302 to Google with `Set-Cookie: wc_google_flow` (HttpOnly, Secure, SameSite=Lax,
        Path=/api/v1/auth/google, Max-Age=300). Returns 501 when Google login is disabled.
      responses:
        '302':
          description: Redirect to the provider
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        '501':
          description: GOOGLE_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/google/exchange:
    post:
      tags: [Identity]
      operationId: googleExchange
      security: []
      summary: Exchange the callback code for a WebChat token
      description: |
        Requires the `wc_google_flow` cookie. `state` is single-use. When Google login is disabled this
        returns 501 and does not read the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleExchange' }
      responses:
        '200':
          description: OK; the flow cookie is cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: OAUTH_STATE_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: GOOGLE_CODE_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '501':
          description: GOOGLE_DISABLED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: GOOGLE_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/friend-requests:
    post:
      tags: [Social]
      operationId: createFriendRequest
      summary: Invite someone, or replay the pending invitation
      description: |
        201 for a new request. 200 when the same direction is already pending. A reverse pending
        request returns 409 with `error.related_id` pointing at it.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FriendRequestCreate' }
            examples:
              longInvitesLam:
                summary: Long invites Lâm
                value: { recipient_id: a1000000-0000-4000-8000-000000000002 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequest' }
              examples:
                created:
                  value:
                    id: f1000000-0000-4000-8000-000000000001
                    sender: { id: a1000000-0000-4000-8000-000000000001, username: long }
                    recipient: { id: a1000000-0000-4000-8000-000000000002, username: lam }
                    status: pending
                    created_at: '2026-11-26T02:00:00Z'
        '200':
          description: Existing pending request in the same direction
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequest' }
              examples:
                replayed:
                  summary: Long sends the same invitation again
                  value:
                    id: f1000000-0000-4000-8000-000000000001
                    sender: { id: a1000000-0000-4000-8000-000000000001, username: long }
                    recipient: { id: a1000000-0000-4000-8000-000000000002, username: lam }
                    status: pending
                    created_at: '2026-11-26T02:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: USER_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                userNotFound:
                  value:
                    request_id: 55000000-0000-4000-8000-000000000004
                    error: { code: USER_NOT_FOUND, message: Không tìm thấy người nhận. }
        '409':
          description: ALREADY_FRIENDS or INCOMING_REQUEST_EXISTS (see error.related_id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                incomingRequestExists:
                  summary: Lâm already invited Long; accept that one instead
                  value:
                    request_id: 55000000-0000-4000-8000-000000000005
                    error:
                      code: INCOMING_REQUEST_EXISTS
                      message: Người này đã gửi lời mời cho bạn.
                      related_id: f1000000-0000-4000-8000-000000000002
                alreadyFriends:
                  value:
                    request_id: 55000000-0000-4000-8000-000000000006
                    error: { code: ALREADY_FRIENDS, message: Hai người đã là bạn. }
        '422':
          description: SELF_INVITE or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                selfInvite:
                  value:
                    request_id: 55000000-0000-4000-8000-000000000007
                    error: { code: SELF_INVITE, message: Không thể tự kết bạn với chính mình. }
        '503':
          description: IDENTITY_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    get:
      tags: [Social]
      operationId: listFriendRequests
      summary: List incoming or outgoing requests
      description: Cursor-paginated. Filters by direction (default incoming) and status (default pending).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: direction
          in: query
          schema: { type: string, enum: [incoming, outgoing], default: incoming }
        - name: status
          in: query
          schema: { type: string, enum: [pending, accepted, declined, cancelled], default: pending }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ordered by created_at then id, descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequestPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/friend-requests/{request_id}:
    patch:
      tags: [Social]
      operationId: decideFriendRequest
      summary: Accept, decline or cancel a request
      description: |
        The recipient decides accepted/declined; the sender cancels. Repeating the same decision by the
        same actor returns 200 even after the friendship was later removed. Two different decisions
        race; exactly one leaves pending.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FriendRequestDecision' }
            examples:
              accept:
                summary: Lâm accepts
                value: { status: accepted }
      responses:
        '200':
          description: The request after the decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FriendRequest' }
              examples:
                accepted:
                  value:
                    id: f1000000-0000-4000-8000-000000000001
                    sender: { id: a1000000-0000-4000-8000-000000000001, username: long }
                    recipient: { id: a1000000-0000-4000-8000-000000000002, username: lam }
                    status: accepted
                    created_at: '2026-11-26T02:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: ACTION_FORBIDDEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                senderCannotAccept:
                  summary: Long (the sender) tries to accept his own invitation
                  value:
                    request_id: 55000000-0000-4000-8000-000000000008
                    error: { code: ACTION_FORBIDDEN, message: Chỉ người nhận được chấp nhận hoặc từ chối. }
        '404':
          description: REQUEST_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                requestNotFound:
                  value:
                    request_id: 55000000-0000-4000-8000-000000000009
                    error: { code: REQUEST_NOT_FOUND, message: Không tìm thấy lời mời. }
        '409':
          description: REQUEST_CLOSED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                requestClosed:
                  summary: Long cancelled before Lâm accepted
                  value:
                    request_id: 55000000-0000-4000-8000-000000000010
                    error: { code: REQUEST_CLOSED, message: Lời mời đã được xử lý. }
        '422':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/friends:
    get:
      tags: [Social]
      operationId: listFriends
      summary: Friends of the caller, ordered by username then id
      description: Cursor-paginated list of current friends as PublicUser.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/friends/{friend_id}:
    delete:
      tags: [Social]
      operationId: deleteFriend
      summary: Remove the friendship in both directions
      description: |
        Idempotent: a repeated call also returns 204. Direct-chat history and shared group membership
        remain readable; new direct messages require a new friendship.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: friend_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Removed (or already absent)
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/direct/{friend_id}:
    put:
      tags: [Social]
      operationId: putDirectConversation
      summary: Open the one direct conversation with a friend
      description: |
        201 when created, 200 when it already exists. A→B and B→A resolve to the same id. `peer` is the
        other person from the caller's point of view.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: friend_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectConversation' }
              examples:
                longOpens:
                  summary: Long opens the chat; peer is Lâm
                  value:
                    id: c1000000-0000-4000-8000-000000000001
                    type: direct
                    peer: { id: a1000000-0000-4000-8000-000000000002, username: lam }
                    created_at: '2026-11-26T02:05:00Z'
        '200':
          description: Existing conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectConversation' }
              examples:
                lamOpens:
                  summary: Lâm opens the same chat; same id, peer is Long
                  value:
                    id: c1000000-0000-4000-8000-000000000001
                    type: direct
                    peer: { id: a1000000-0000-4000-8000-000000000001, username: long }
                    created_at: '2026-11-26T02:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: FRIENDSHIP_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                notFriends:
                  summary: The two users are not (or no longer) friends
                  value:
                    request_id: 55000000-0000-4000-8000-000000000012
                    error: { code: FRIENDSHIP_REQUIRED, message: Hai người chưa là bạn. }
        '422':
          description: SELF_CONVERSATION or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/conversations/groups:
    post:
      tags: [Social]
      operationId: createGroupConversation
      summary: Create a group atomically
      description: |
        `member_ids` are 2–49 distinct friends; the creator joins automatically. The whole request
        fails if any member is not a friend. Replaying the same `Idempotency-Key` with the same body
        within 24 hours returns 200 and the stored response; a different body returns 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupConversation' }
        '200':
          description: Replayed response for the same idempotency key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupConversation' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: FRIENDSHIP_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: IDEMPOTENCY_CONFLICT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: INVALID_MEMBERS or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/conversations:
    get:
      tags: [Social]
      operationId: listConversations
      summary: Conversations of the caller
      description: Cursor-paginated direct and group conversations the caller belongs to.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ordered by created_at then id, descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/conversations/{conversation_id}:
    get:
      tags: [Social]
      operationId: getConversation
      summary: One conversation the caller belongs to
      description: An outsider and a missing id both return 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: Direct or group conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/conversations/{conversation_id}/members:
    get:
      tags: [Social]
      operationId: listConversationMembers
      summary: Members, ordered by username then id
      description: Cursor-paginated members of a conversation the caller belongs to; an outsider gets 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Includes the caller; works for direct and group conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/conversations/{conversation_id}/attachments:
    post:
      tags: [Chat]
      operationId: uploadAttachment
      summary: Upload a pending attachment
      description: |
        Requires `can_send`. Exactly one `file` part. `kind=audio` accepts 1 byte–10 MiB, at most
        300 s, and WebM/Ogg/MP4/MPEG/WAV; `kind=file` accepts 1 byte–25 MiB. Chat determines the MIME
        type and duration. A pending attachment expires after 24 hours; uploading again creates a new id.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [audio, file] }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Created; pending until bound to a message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: FRIENDSHIP_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: UPLOAD_TOO_LARGE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: INVALID_ATTACHMENT or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          $ref: '#/components/responses/ChatServiceUnavailable'

  /api/v1/conversations/{conversation_id}/attachments/{attachment_id}/content:
    get:
      tags: [Chat]
      operationId: downloadAttachment
      summary: Download the stored bytes
      description: |
        Requires `can_read`. A pending attachment is readable only by its uploader; once bound, any
        member with read access may download it. `Content-Disposition` is `inline` for audio and
        `attachment` for files. Never cache a private response.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: attachment_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The stored bytes
          headers:
            Content-Type:
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CONVERSATION_NOT_FOUND or ATTACHMENT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ChatServiceUnavailable'

  /api/v1/conversations/{conversation_id}/messages:
    get:
      tags: [Chat]
      operationId: listMessages
      summary: History page
      description: |
        Newest and older pages are descending by `seq`; a backfill page (`after_seq`) is ascending.
        `before_seq` and `after_seq` are exclusive bounds and cannot be used together. `through_seq`
        is an inclusive upper bound, allowed only with `after_seq` and must be ≥ it; for example
        `after_seq=40&through_seq=45` returns seq 41–45.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Limit'
        - name: before_seq
          in: query
          schema: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        - name: after_seq
          in: query
          schema: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
        - name: through_seq
          in: query
          description: Inclusive upper bound. Only with after_seq, and must be ≥ after_seq.
          schema: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
              examples:
                newestPage:
                  summary: Lâm reloads the page with limit=3; newest first (descending seq), Long sent seq 1-12
                  value:
                    items:
                      - id: e1000000-0000-4000-8000-000000000012
                        conversation_id: c1000000-0000-4000-8000-000000000001
                        seq: 12
                        sender: { id: a1000000-0000-4000-8000-000000000001, username: long }
                        created_at: '2026-11-26T14:47:30Z'
                        client_message_id: d1000000-0000-4000-8000-000000000012
                        content: { type: text, text: Mà ai chạy Prism lúc demo vậy? }
                      - id: e1000000-0000-4000-8000-000000000011
                        conversation_id: c1000000-0000-4000-8000-000000000001
                        seq: 11
                        sender: { id: a1000000-0000-4000-8000-000000000001, username: long }
                        created_at: '2026-11-26T14:41:10Z'
                        client_message_id: d1000000-0000-4000-8000-000000000011
                        content: { type: text, text: Báo cáo nộp trước 23h thứ Sáu nha. }
                      - id: e1000000-0000-4000-8000-000000000010
                        conversation_id: c1000000-0000-4000-8000-000000000001
                        seq: 10
                        sender: { id: a1000000-0000-4000-8000-000000000001, username: long }
                        created_at: '2026-11-26T14:40:00Z'
                        client_message_id: d1000000-0000-4000-8000-000000000010
                        content: { type: text, text: "Lâm làm slide giúp mình nhé, tiện sửa luôn phần demo." }
                    has_more: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                outsider:
                  summary: An outsider and a missing id get the same answer
                  value:
                    request_id: 55000000-0000-4000-8000-000000000013
                    error: { code: CONVERSATION_NOT_FOUND, message: Không tìm thấy hội thoại. }
        '422':
          description: INVALID_RANGE or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalidRange:
                  summary: before_seq and after_seq used together
                  value:
                    request_id: 55000000-0000-4000-8000-000000000014
                    error: { code: INVALID_RANGE, message: Không dùng before_seq cùng after_seq. }
        '503':
          $ref: '#/components/responses/ChatServiceUnavailable'

  /api/v1/conversations/{conversation_id}/messages/search:
    get:
      tags: [Chat]
      operationId: searchMessages
      summary: Substring search in the text of one conversation
      description: |
        Trims `q`, normalizes NFC, ignores case but keeps diacritics. `q` is 1–200 code points. Only
        text content is searched. No match returns an empty `items`.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/Limit'
        - name: before_seq
          in: query
          schema: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ChatServiceUnavailable'

  /api/v1/conversations/{conversation_id}/read-state:
    get:
      tags: [Chat]
      operationId: getReadState
      summary: Read marker and unread text count
      description: Returns last_read_seq (0 if never read), latest_seq and the unread text count from other people.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadState' }
              examples:
                unread:
                  summary: Lâm opens the chat after Long sent 12 texts
                  value: { last_read_seq: 0, latest_seq: 12, unread_text_count: 12 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ChatServiceUnavailable'
    put:
      tags: [Chat]
      operationId: putReadState
      summary: Advance the read marker monotonically
      description: Sets the marker to max(old, through_seq) atomically. through_seq above latest_seq returns 422 READ_AHEAD.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadStateUpdate' }
            examples:
              readAll:
                value: { through_seq: 12 }
      responses:
        '200':
          description: The state after max(old, through_seq)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadState' }
              examples:
                caughtUp:
                  value: { last_read_seq: 12, latest_seq: 12, unread_text_count: 0 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: READ_AHEAD or VALIDATION_ERROR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                readAhead:
                  summary: through_seq is above latest_seq
                  value:
                    request_id: 55000000-0000-4000-8000-000000000015
                    error: { code: READ_AHEAD, message: through_seq vượt quá latest_seq. }
        '503':
          $ref: '#/components/responses/ChatServiceUnavailable'

  /api/v1/conversations/{conversation_id}/unread-summary:
    post:
      tags: [Chat]
      operationId: createUnreadSummary
      summary: Summarize unread text from other people
      description: |
        Fixes the read marker and `snapshot_seq`, filters text from other users in the open range, and
        sends at most the newest 100 messages to the LLM in ascending `seq`. Never moves the read
        marker. No body. When no eligible message exists, returns `status=empty` without calling the
        LLM.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadSummary' }
              examples:
                ready:
                  summary: Lâm has not read anything yet; Long sent 12 texts (seq 1-12)
                  value:
                    status: ready
                    summary: "long chốt nộp báo cáo trước 23h thứ Sáu, nhờ lam làm slide và sửa phần demo. long hỏi ai chạy Prism lúc demo, chưa có câu trả lời."
                    source_count: 12
                    omitted_count: 0
                    last_read_seq: 0
                    snapshot_seq: 12
                    source_from_seq: 1
                    source_to_seq: 12
                empty:
                  summary: Lâm has already read up to seq 12; nothing unread, so the LLM is not called
                  value:
                    status: empty
                    summary: null
                    source_count: 0
                    omitted_count: 0
                    last_read_seq: 12
                    snapshot_seq: 12
                    source_from_seq: null
                    source_to_seq: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                notMember:
                  summary: Caller is not a member of the conversation
                  value:
                    request_id: 55000000-0000-4000-8000-000000000016
                    error: { code: CONVERSATION_NOT_FOUND, message: Không tìm thấy hội thoại. }
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: SUMMARY_UNAVAILABLE, SOCIAL_UNAVAILABLE, or CHAT_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                summaryUnavailable:
                  summary: The LLM provider timed out; the read marker is unchanged
                  value:
                    request_id: 55000000-0000-4000-8000-000000000017
                    error: { code: SUMMARY_UNAVAILABLE, message: "Chưa tóm tắt được, vui lòng thử lại sau." }

  /internal/v1/users/{user_id}:
    get:
      tags: [Internal]
      operationId: internalGetUser
      summary: Social looks up a user in Identity
      description: Requires a service token with `aud=identity-internal`.
      security: [{ serviceAuth: [] }]
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: SERVICE_FORBIDDEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: USER_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /internal/v1/conversations/{conversation_id}/members/{user_id}/permissions:
    get:
      tags: [Internal]
      operationId: internalGetPermissions
      summary: Chat asks Social whether a user may read and send
      description: |
        Requires a service token with `aud=social-internal` and `sub=chat`. `user_id` always comes from
        the authenticated user's token, never from the request body. An outsider and a missing
        conversation both return 404.
      security: [{ serviceAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Permissions' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: SERVICE_FORBIDDEN
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Browser token, `aud=webchat`.
    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service token, audience of the callee and `sub` of the caller.

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    Cursor:
      name: cursor
      in: query
      description: Opaque `next_cursor` from the previous page.
      schema: { type: string }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: request_id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            missingToken:
              summary: No bearer token, or the token is expired or has the wrong audience
              value:
                request_id: 55000000-0000-4000-8000-000000000000
                error: { code: UNAUTHENTICATED, message: Cần đăng nhập. }
    ValidationError:
      description: VALIDATION_ERROR (malformed path, query or body value)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ChatServiceUnavailable:
      description: SOCIAL_UNAVAILABLE or CHAT_UNAVAILABLE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[A-Za-z0-9_]+$'
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 128 }

    GoogleExchange:
      type: object
      additionalProperties: false
      required: [code, state]
      properties:
        code: { type: string }
        state: { type: string }

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, username]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }

    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, minimum: 1 }
        user: { $ref: '#/components/schemas/PublicUser' }

    ErrorField:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field: { type: string }
        reason: { type: string }

    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/ErrorField' }
        related_id: { type: string, format: uuid }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, error]
      properties:
        request_id: { type: string, format: uuid }
        error: { $ref: '#/components/schemas/Error' }

    ErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - USERNAME_TAKEN
        - USER_NOT_FOUND
        - NOT_FOUND
        - GOOGLE_DISABLED
        - GOOGLE_UNAVAILABLE
        - GOOGLE_CODE_INVALID
        - OAUTH_STATE_INVALID
        - VALIDATION_ERROR
        - SELF_INVITE
        - ALREADY_FRIENDS
        - INCOMING_REQUEST_EXISTS
        - ACTION_FORBIDDEN
        - REQUEST_NOT_FOUND
        - REQUEST_CLOSED
        - INVALID_CURSOR
        - SELF_CONVERSATION
        - FRIENDSHIP_REQUIRED
        - CONVERSATION_NOT_FOUND
        - INVALID_MEMBERS
        - IDEMPOTENCY_CONFLICT
        - ATTACHMENT_NOT_FOUND
        - INVALID_ATTACHMENT
        - UPLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - INVALID_RANGE
        - READ_AHEAD
        - SUMMARY_UNAVAILABLE
        - SOCIAL_UNAVAILABLE
        - CHAT_UNAVAILABLE
        - IDENTITY_UNAVAILABLE
        - SERVICE_FORBIDDEN
        - INVALID_FRAME
        - NOT_SUBSCRIBED
        - ALREADY_AUTHENTICATED
        - ATTACHMENT_KIND_MISMATCH
        - ATTACHMENT_IN_USE
        - CLIENT_MESSAGE_ID_CONFLICT

    FriendRequestCreate:
      type: object
      additionalProperties: false
      required: [recipient_id]
      properties:
        recipient_id: { type: string, format: uuid }

    FriendRequestDecision:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [accepted, declined, cancelled] }

    FriendRequest:
      type: object
      additionalProperties: false
      required: [id, sender, recipient, status, created_at]
      properties:
        id: { type: string, format: uuid }
        sender: { $ref: '#/components/schemas/PublicUser' }
        recipient: { $ref: '#/components/schemas/PublicUser' }
        status: { type: string, enum: [pending, accepted, declined, cancelled] }
        created_at: { type: string, format: date-time }

    UserPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicUser' }
        next_cursor:
          type: [string, 'null']

    FriendRequestPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FriendRequest' }
        next_cursor:
          type: [string, 'null']

    DirectConversation:
      type: object
      additionalProperties: false
      required: [id, type, peer, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [direct] }
        peer: { $ref: '#/components/schemas/PublicUser' }
        created_at: { type: string, format: date-time }

    GroupConversation:
      type: object
      additionalProperties: false
      required: [id, type, name, created_by, member_count, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [group] }
        name: { type: string, minLength: 1, maxLength: 80 }
        created_by: { $ref: '#/components/schemas/PublicUser' }
        member_count: { type: integer, minimum: 3, maximum: 50 }
        created_at: { type: string, format: date-time }

    Conversation:
      oneOf:
        - $ref: '#/components/schemas/DirectConversation'
        - $ref: '#/components/schemas/GroupConversation'
      discriminator:
        propertyName: type
        mapping:
          direct: '#/components/schemas/DirectConversation'
          group: '#/components/schemas/GroupConversation'

    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_cursor:
          type: [string, 'null']

    GroupCreate:
      type: object
      additionalProperties: false
      required: [name, member_ids]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        member_ids:
          type: array
          minItems: 2
          maxItems: 49
          uniqueItems: true
          items: { type: string, format: uuid }

    Attachment:
      type: object
      additionalProperties: false
      required: [id, kind, file_name, media_type, byte_size]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [audio, file] }
        file_name: { type: string }
        media_type: { type: string }
        byte_size: { type: integer, minimum: 1 }
        duration_ms:
          type: integer
          minimum: 0
          maximum: 300000
          description: Present only when kind=audio (required inside StoredAudioContent).

    TextContent:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: { type: string, enum: [text] }
        text: { type: string, minLength: 1, maxLength: 4000 }

    StoredAudioContent:
      type: object
      additionalProperties: false
      required: [type, attachment]
      properties:
        type: { type: string, enum: [audio] }
        attachment:
          allOf:
            - $ref: '#/components/schemas/Attachment'
            - required: [duration_ms]
              properties:
                kind: { const: audio }

    StoredFileContent:
      type: object
      additionalProperties: false
      required: [type, attachment]
      properties:
        type: { type: string, enum: [file] }
        attachment:
          allOf:
            - $ref: '#/components/schemas/Attachment'
            - properties:
                kind: { const: file }

    MessageContent:
      oneOf:
        - $ref: '#/components/schemas/TextContent'
        - $ref: '#/components/schemas/StoredAudioContent'
        - $ref: '#/components/schemas/StoredFileContent'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextContent'
          audio: '#/components/schemas/StoredAudioContent'
          file: '#/components/schemas/StoredFileContent'

    Message:
      type: object
      additionalProperties: false
      required: [id, conversation_id, seq, sender, created_at, client_message_id, content]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        seq: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991 }
        sender: { $ref: '#/components/schemas/PublicUser' }
        created_at: { type: string, format: date-time }
        client_message_id: { type: string, format: uuid }
        content: { $ref: '#/components/schemas/MessageContent' }

    MessagePage:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        has_more: { type: boolean }

    ReadState:
      type: object
      additionalProperties: false
      required: [last_read_seq, latest_seq, unread_text_count]
      properties:
        last_read_seq: { type: integer, format: int64, minimum: 0 }
        latest_seq: { type: integer, format: int64, minimum: 0 }
        unread_text_count: { type: integer, minimum: 0 }

    ReadStateUpdate:
      type: object
      additionalProperties: false
      required: [through_seq]
      properties:
        through_seq: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }

    Permissions:
      type: object
      additionalProperties: false
      required: [can_read, can_send]
      properties:
        can_read: { type: boolean }
        can_send: { type: boolean }

    UnreadSummary:
      type: object
      additionalProperties: false
      required:
        - status
        - summary
        - source_count
        - omitted_count
        - last_read_seq
        - snapshot_seq
        - source_from_seq
        - source_to_seq
      properties:
        status: { type: string, enum: [ready, empty] }
        summary:
          type: [string, 'null']
        source_count: { type: integer, minimum: 0, maximum: 100 }
        omitted_count: { type: integer, minimum: 0 }
        last_read_seq: { type: integer, format: int64, minimum: 0 }
        snapshot_seq: { type: integer, format: int64, minimum: 0 }
        source_from_seq:
          type: [integer, 'null']
          minimum: 0
        source_to_seq:
          type: [integer, 'null']
          minimum: 0
